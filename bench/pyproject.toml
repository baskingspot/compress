[project]
name = "compress-bench"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["boto3>=1.43", "click>=8.5", "ec2bench", "pydantic>=2.14", "rich>=15"]

[project.scripts]
bench = "ec2bench.cli:main"

[tool.uv.sources]
ec2bench = { git = "https://github.com/baskingspot/infra", rev = "v0.1.0", subdirectory = "harness" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compress_bench"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "ty==0.0.91"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D", "CPY001", "COM812", "TC001", "TC002", "TC003",
  "S603", "S607", "TRY003", "EM101", "EM102", "PLR2004",
  "FBT001", "FBT002", "PLR0913", "ANN401", "PLC0415",
]

[tool.ty.environment]
python-version = "3.15"
