# The compress site, at baskingspot.dev/compress/. Built with `just doc`, on
# the baskingspot theme (baskingspot/nix, docs/README.md).
base_url = "https://baskingspot.dev/compress"
theme = "baskingspot"
title = "compress"
description = "Compression codecs in pure Zig: Snappy, DEFLATE, gzip, zlib, and Zstandard, plus a Brotli decoder."

generate_feeds = false
build_search_index = false

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/compress"
