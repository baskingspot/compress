name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/ci.yml@081fb74a8d4731828de4f067e0106fef6df1bdec # v0.5.0
    with:
      # One job per recipe, and per cross target. The 32-bit x86 target stays
      # blocking because it catches the usize and shift bugs the gate exists
      # for. The other targets run and show, and a failure does not fail CI.
      recipes: '["test", "lint", "doc", "check-target x86_64-linux", "check-target x86-linux", "check-target arm-linux", "check-target riscv64-linux", "check-target wasm32-wasi"]'
      non-blocking: '["check-target arm-linux", "check-target riscv64-linux", "check-target wasm32-wasi"]'
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Deploys the site after CI passes on main. It stays skipped until
  # Terraform in baskingspot/site has registered the site, which sets the
  # variable and the secret.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/deploy-docs.yml@081fb74a8d4731828de4f067e0106fef6df1bdec # v0.5.0
    with:
      account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
