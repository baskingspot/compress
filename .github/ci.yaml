# The support tier is x86_64-linux, aarch64-linux, and aarch64-macos; a
# failure there fails CI. Every other target is best effort: its job runs and
# shows, and a break or a hung runner never blocks anything.
jobs:
  - recipe: test
  # The over-4-GiB zstd scale test allocates about 4 GiB, so the gate recipes
  # skip it and this job runs it alone.
  - recipe: test-giant
  # The unit tests on s390x under qemu-user: the only big-endian coverage,
  # since every other target is little-endian.
  - recipe: test-be
  - recipe: lint
  - recipe: doc
  - recipe: check-target x86_64-linux
  - recipe: check-target aarch64-linux
  - recipe: check-target x86-linux
    blocking: false
  # The weekly workflow checks arm-linux and riscv64-linux library objects.
  # Their test-binary code generation costs too much for pull-request CI.
  - recipe: check-target wasm32-wasi
    blocking: false
  # aarch64-darwin is in the support tier, so its failure fails CI.
  - recipe: test
    runners: [macos-26]
