# First class: Linux on x86_64 and aarch64. A failure there fails CI.
# Everything else is a stretch goal. Its jobs run and show, and a failure does
# not fail CI: a break on a 32-bit target gets fixed after the fact.
jobs:
  - recipe: test
  # The compatibility lane: the previous Zig must compile and pass the whole
  # suite too. `check` is the per-version gate (Debug, ReleaseSafe, ReleaseFast).
  - recipe: check
    shell: zig-old
  # The unit tests on s390x under qemu-user: the only big-endian coverage,
  # since every other target is little-endian.
  - recipe: test-be
  - recipe: lint
  - recipe: doc
  - recipe: check-target x86_64-linux
  - recipe: check-target aarch64-linux
  - recipe: check-target x86-linux
    blocking: false
  - recipe: check-target arm-linux
    blocking: false
  - recipe: check-target riscv64-linux
    blocking: false
  - recipe: check-target wasm32-wasi
    blocking: false
  # macOS on aarch64 works for some projects and not others.
  - recipe: test
    runners: [macos-26]
    blocking: false
